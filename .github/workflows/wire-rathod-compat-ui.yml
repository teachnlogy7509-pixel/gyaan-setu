name: Wire RATHOD compatibility UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject compatibility script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="rathod-compat.js" defer></script>'
          if 'rathod-compat.js' not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html has no closing body tag')
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit wiring change
        shell: bash
        run: |
          git config user.name 'gyaan-setu-bot'
          git config user.email 'gyaan-setu-bot@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Compatibility script already wired.'
          else
            git commit -m 'Wire RATHOD compatibility layer into app shell'
            git push
          fi
