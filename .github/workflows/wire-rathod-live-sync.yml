name: Wire RATHOD live sync client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject live sync script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="rathod-live-sync.js" defer></script>'
          if 'rathod-live-sync.js' not in text:
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit wiring change
        shell: bash
        run: |
          git config user.name 'gyaan-setu-bot'
          git config user.email 'gyaan-setu-bot@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Live sync already wired.'; else git commit -m 'Wire RATHOD live sync client'; git push; fi
